[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-ebooks"
version = "0.1.0"
description = "Find new titles added to an Overdrive or CloudLibrary collection since your last check"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "keyring>=24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
new-ebooks = "new_ebooks.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["new_ebooks*"]

[tool.ruff.lint]
# Selected explicitly, never left to ruff's defaults: CI installs ruff
# unpinned, so an implicit rule set lets each new release turn the build red on
# untouched code (0.16 broadening its defaults did exactly that). Adding a rule
# here is a deliberate change that carries its own cleanup.
select = [
    "E4", "E7", "E9", "F",
    "I",        # import sorting
    "UP",       # pyupgrade
    "BLE001",   # blind except
    "C408",     # unnecessary dict()/list() calls
    "DTZ005",   # naive datetime.now()
    "PLR0402",  # import x.y as y
    "PLW1510",  # subprocess.run without explicit check=
    "RUF019",   # redundant key-then-index
    "RUF059",   # unused unpacked variable
    "SIM102",   # collapsible if
]

[tool.ruff.lint.per-file-ignores]
# Every command is a boundary between the user and the network, the keychain,
# launchd and SMTP; each catch-all reports the failure and continues or exits
# non-zero, which is the point. Narrowing them would only re-raise as a
# traceback at the user.
"new_ebooks/cli.py" = ["BLE001"]
