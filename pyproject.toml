[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-ebooks"
version = "0.1.0"
description = "Find new titles added to an Overdrive or CloudLibrary collection since your last check"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "keyring>=24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
new-ebooks = "new_ebooks.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["new_ebooks*"]

[tool.ruff.lint]
# CI installs ruff unpinned, so leaving this unset means each new ruff release
# can turn the build red on untouched code — 0.16 broadening the defaults did
# exactly that. These are the rules the repo has always been linted against
# (ruff's historical default select); widening it is a deliberate, separate
# change with its own cleanup.
select = ["E4", "E7", "E9", "F"]
